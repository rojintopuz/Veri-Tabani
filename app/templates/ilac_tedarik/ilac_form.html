{% extends "base.html" %}
{% block title %}{{ "İlaç Düzenle" if ilac else "Yeni İlaç" }} - Eczane VTYS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h1 class="h5 mb-0">{{ "İlaç Düzenle" if ilac else "Yeni İlaç Ekle" }}</h1>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="ticari_ad" class="form-label">Ticari Adı *</label>
                        <input type="text" class="form-control" id="ticari_ad" name="ticari_ad"
                               maxlength="100" required value="{{ ilac.ticari_ad if ilac else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="formul" class="form-label">Formül</label>
                        <input type="text" class="form-control" id="formul" name="formul"
                               maxlength="250" value="{{ (ilac.formul or '') if ilac else '' }}">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('ilac_tedarik.ilac_listele') }}" class="btn btn-outline-secondary">İptal</a>
                        <button type="submit" class="btn btn-primary">Kaydet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
