{% extends "base.html" %}
{% block title %}{{ "Tedarik Düzenle" if tedarik else "Yeni Tedarik" }} - Eczane VTYS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h1 class="h5 mb-0">{{ "Tedarik Düzenle" if tedarik else "Yeni Tedarik Ekle" }}</h1>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="tedarikci_no" class="form-label">Tedarikçi *</label>
                        <select class="form-select" id="tedarikci_no" name="tedarikci_no" required>
                            <option value="">Seçiniz...</option>
                            {% for tc in tedarikciler %}
                            <option value="{{ tc.tedarikci_no }}"
                                {% if tedarik and tedarik.tedarikci_no == tc.tedarikci_no %}selected{% endif %}>
                                {{ tc.ad }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="eczane_no" class="form-label">Eczane *</label>
                        <select class="form-select" id="eczane_no" name="eczane_no" required>
                            <option value="">Seçiniz...</option>
                            {% for e in eczaneler %}
                            <option value="{{ e.eczane_no }}"
                                {% if tedarik and tedarik.eczane_no == e.eczane_no %}selected{% endif %}>
                                {{ e.ad }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="ilac_no" class="form-label">İlaç *</label>
                        <select class="form-select" id="ilac_no" name="ilac_no" required>
                            <option value="">Seçiniz...</option>
                            {% for i in ilaclar %}
                            <option value="{{ i.ilac_no }}"
                                {% if tedarik and tedarik.ilac_no == i.ilac_no %}selected{% endif %}>
                                {{ i.ticari_ad }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <label for="miktar" class="form-label">Miktar (kutu) *</label>
                            <input type="number" class="form-control" id="miktar" name="miktar"
                                   min="1" step="1" required value="{{ tedarik.miktar if tedarik else '' }}">
                        </div>
                        <div class="col-sm-6 mb-3">
                            <label for="tedarik_tarihi" class="form-label">Tedarik Tarihi *</label>
                            <input type="date" class="form-control" id="tedarik_tarihi" name="tedarik_tarihi" required
                                   value="{{ tedarik.tedarik_tarihi.isoformat() if tedarik else bugun }}">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('ilac_tedarik.tedarik_listele') }}" class="btn btn-outline-secondary">İptal</a>
                        <button type="submit" class="btn btn-primary">Kaydet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
