{% extends "base.html" %}
{% block title %}{{ "Telefon Düzenle" if telefon else "Yeni Telefon" }} - Eczane VTYS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h1 class="h5 mb-0">{{ "Telefon Düzenle" if telefon else "Yeni Telefon Ekle" }}</h1>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="eczane_no" class="form-label">Eczane *</label>
                        <select class="form-select" id="eczane_no" name="eczane_no" required>
                            <option value="">Eczane seçiniz...</option>
                            {% for e in eczaneler %}
                            <option value="{{ e.eczane_no }}"
                                {% if telefon and telefon.eczane_no == e.eczane_no %}selected{% endif %}>
                                {{ e.eczane_no }} - {{ e.ad }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="telefon_no" class="form-label">Telefon Numarası *</label>
                        <input type="text" class="form-control" id="telefon_no" name="telefon_no"
                               placeholder="02241234567" pattern="^0[0-9]{10}$" maxlength="15" required
                               value="{{ telefon.telefon_no if telefon else '' }}">
                        <div class="form-text">0 ile başlayan 11 haneli rakam giriniz.</div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('eczane_satis.telefon_listele') }}" class="btn btn-outline-secondary">İptal</a>
                        <button type="submit" class="btn btn-primary">Kaydet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
