{% extends "base.html" %}
{% block title %}{{ "Muayene Düzenle" if duzenleme else "Yeni Muayene" }} - Eczane VTYS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h1 class="h5 mb-0">{{ "Muayene Düzenle" if duzenleme else "Yeni Muayene Ekle" }}</h1>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="hasta_kimlik_no" class="form-label">Hasta *</label>
                        <select class="form-select" id="hasta_kimlik_no" name="hasta_kimlik_no" required>
                            <option value="">Seçin…</option>
                            {% for h in hastalar %}
                            <option value="{{ h.hasta_kimlik_no }}"
                                {% if muayene and muayene.hasta_kimlik_no == h.hasta_kimlik_no %}selected{% endif %}>
                                {{ h.ad }} ({{ h.hasta_kimlik_no }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="doktor_no" class="form-label">Doktor *</label>
                        <select class="form-select" id="doktor_no" name="doktor_no" required>
                            <option value="">Seçin…</option>
                            {% for d in doktorlar %}
                            <option value="{{ d.doktor_no }}"
                                {% if muayene and muayene.doktor_no|string == d.doktor_no|string %}selected{% endif %}>
                                {{ d.ad }} ({{ d.uzmanlik_alani }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="muayene_tarihi" class="form-label">Muayene Tarihi *</label>
                        <input type="date" class="form-control" id="muayene_tarihi" name="muayene_tarihi"
                               required max="{{ bugun }}"
                               value="{{ muayene.muayene_tarihi if muayene and muayene.muayene_tarihi else bugun }}">
                        <div class="form-text">Gelecek bir tarih girilemez (veritabanı tetikleyicisi engeller).</div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('hasta_muayene.muayene_listele') }}" class="btn btn-outline-secondary">İptal</a>
                        <button type="submit" class="btn btn-primary">Kaydet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
